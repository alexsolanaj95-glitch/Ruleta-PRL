<title>Ruleta del curro</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --txt:#16191d; --soft:#6a7280; --line:#dfe3e8;
    --acc:#1d4ed8; --ok:#15803d; --medias:#b45309; --fuera:#7c3aed; --shadow:0 2px 12px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181f; --panel:#1d222b; --txt:#e8ebf0; --soft:#949cab; --line:#2e3542;
      --acc:#60a5fa; --ok:#4ade80; --medias:#fbbf24; --fuera:#c4b5fd; --shadow:0 2px 12px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181f; --panel:#1d222b; --txt:#e8ebf0; --soft:#949cab; --line:#2e3542;
    --acc:#60a5fa; --ok:#4ade80; --medias:#fbbf24; --fuera:#c4b5fd; --shadow:0 2px 12px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--txt);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(44px + env(safe-area-inset-bottom));
    max-width:560px; margin-inline:auto; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
  h1{font-size:1.25rem; margin:0; letter-spacing:-.01em}
  .ver{font-size:.7rem; color:var(--soft); letter-spacing:.04em; margin-top:1px}
  h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.07em; color:var(--soft);
     margin:24px 0 8px; font-weight:600}
  button{font:inherit; color:var(--txt); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:9px 13px; cursor:pointer}
  button:active{transform:translateY(1px)}
  input,select{font:inherit; color:var(--txt); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 11px; min-width:0}

  .cab{display:flex; align-items:center; justify-content:space-between; gap:10px}
  #mas{width:40px; height:40px; padding:0; font-size:1.5rem; line-height:1; border-radius:50%;
    background:var(--acc); color:#fff; border:none; flex:none}
  .alta{display:none; flex-direction:column; gap:8px; margin-top:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px}
  .alta.abierta{display:flex}
  .alta .rit{display:flex; gap:6px; flex-wrap:wrap}
  .alta .rit button{flex:1; min-width:78px; font-size:.85rem; padding:8px 6px}
  .alta .rit button.on{background:var(--acc); color:#fff; border-color:var(--acc)}
  .alta .fin{display:flex; gap:8px}
  .alta .fin button{flex:1}
  #nueva-version{display:none; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;
    background:var(--panel); border:1px solid var(--acc); border-radius:12px; padding:10px 12px; font-size:.9rem}
  #nueva-version.on{display:flex}

  #fuera-aviso{display:none; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;
    background:var(--panel); border:1px solid var(--fuera); color:var(--fuera);
    border-radius:12px; padding:10px 12px; font-size:.9rem; font-weight:600}
  #fuera-aviso.on{display:flex}
  #fuera-aviso button{color:var(--txt)}

  .wheelbox{position:relative; width:100%; max-width:340px; margin:16px auto 0}
  svg{width:100%; height:auto; display:block}
  #aguja{position:absolute; top:-2px; left:50%; transform:translateX(-50%); z-index:2;
    width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent;
    border-top:20px solid var(--acc); filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  #giro{transition:transform 4.6s cubic-bezier(.16,.72,.14,1); transform-origin:150px 150px}
  .vacio{display:flex; align-items:center; justify-content:center; text-align:center;
    min-height:210px; color:var(--soft); padding:24px; border:1px dashed var(--line); border-radius:16px}
  #girar{display:block; width:100%; max-width:340px; margin:16px auto 0; background:var(--acc);
    color:#fff; border:none; padding:16px; font-size:1.05rem; font-weight:600; border-radius:12px}
  #girar:disabled{opacity:.4}

  .tarjeta{max-width:340px; margin:14px auto 0; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:16px; text-align:center; box-shadow:var(--shadow)}
  .tarjeta .rot{font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--soft)}
  .tarjeta .que{font-size:1.25rem; font-weight:700; margin:2px 0 4px}
  .tarjeta .det{color:var(--soft); font-size:.85rem}
  .btns{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px}
  .btns button{flex:1; min-width:100px}
  .b-ok{color:#fff !important; background:var(--ok); border-color:var(--ok)}
  .b-acc{color:#fff !important; background:var(--acc); border-color:var(--acc)}
  .b-med{background:none; border-color:var(--medias); color:var(--medias) !important}

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  li{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px}
  li.hecha .nom{text-decoration:line-through; color:var(--soft)}
  .fila1{display:flex; align-items:center; gap:8px}
  .punto{width:11px; height:11px; border-radius:50%; flex:none}
  .nom{flex:1; border:none; background:none; padding:6px 2px; font-weight:600}
  .nom:focus{outline:none; border-bottom:1px solid var(--line)}
  .fila2{display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap}
  .etq{font-size:.75rem; padding:5px 10px; border-radius:20px; border:1px solid var(--line);
    background:none; color:var(--soft); white-space:nowrap}
  .etq.on{border-color:var(--medias); color:var(--medias); font-weight:600}
  .etq.vencida{border-color:var(--acc); color:var(--acc); font-weight:600}
  .mini{border:none; background:none; color:var(--soft); padding:6px 8px; font-size:.82rem}
  .mini.x{font-size:1.15rem; line-height:1}
  .pie{margin-top:16px; color:var(--soft); font-size:.85rem; display:flex;
    justify-content:space-between; align-items:center; gap:10px}
</style>
</head>
<body>

<div class="cab">
  <div><h1>Ruleta del curro</h1><div class="ver">v1.0</div></div>
  <button id="mas" title="Añadir tarea">+</button>
</div>

<div class="alta" id="alta">
  <input id="nueva" type="text" placeholder="Qué hay que hacer" autocomplete="off">
  <div class="rit" id="ritmos"></div>
  <div class="fin">
    <button id="cancelar">Cancelar</button>
    <button id="add" class="b-acc">Añadir</button>
  </div>
</div>

<div id="nueva-version"><span>Hay una versión nueva.</span><button class="b-acc" id="recargar">Actualizar</button></div>
<div id="fuera-aviso"><span id="fuera-txt"></span><button id="volver-fuera">He vuelto</button></div>

<div class="wheelbox" id="caja">
  <div id="aguja"></div>
  <svg id="rueda" viewBox="0 0 300 300" aria-hidden="true">
    <g id="giro"></g>
    <circle cx="150" cy="150" r="20" fill="var(--panel)" stroke="var(--line)" stroke-width="2"></circle>
  </svg>
</div>
<button id="girar">Girar</button>
<div id="salida"></div>

<h2>En la rueda</h2>
<ul id="lista"></ul>
<div id="bloque-hechas" hidden>
  <h2>Hechas</h2>
  <ul id="hechas"></ul>
</div>

<div class="pie">
  <span id="cuenta"></span>
  <button class="mini" id="irme">Estoy fuera</button>
</div>

<script>
const CLAVE = "ruleta-curro-v1";
const VERSION = "1.0";
const RITMOS = [
  { id:"dia",  t:"Cada día",   lab:1 },
  { id:"sem",  t:"Cada semana", lab:5 },
  { id:"quin", t:"Cada 15 días", lab:10 },
  { id:"mes",  t:"Cada mes",   lab:20 },
  { id:"tri",  t:"Cada 3 meses", lab:60 },
  { id:"una",  t:"Una vez",    lab:10 }
];
let S = { tareas:[], fuera:null, fueraDias:0 };
let rot = 0, girando = false, ritmoElegido = "sem";

/* ---------- días laborables ---------- */
// cuenta lunes a viernes entre dos fechas, descontando lo que estuvo "fuera"
function laborablesEntre(a, b){
  let d = new Date(a); d.setHours(0,0,0,0);
  const f = new Date(b); f.setHours(0,0,0,0);
  let n = 0;
  while(d < f){
    d.setDate(d.getDate()+1);
    const w = d.getDay();
    if(w !== 0 && w !== 6) n++;
    if(n > 2000) break;
  }
  return n;
}
function diasDe(x){
  if(!x.ult) return RITMOS.find(r => r.id === x.ritmo).lab; // recién metida: ya toca
  let n = laborablesEntre(x.ult, Date.now()) - (x.fueraDias || 0);
  if(S.fuera) n -= laborablesEntre(S.fuera, Date.now());
  return Math.max(0, n);
}
// el gajo va de 1 a 2 al llegar al plazo, y sigue creciendo si te pasas
function pesoReal(x){
  const plazo = RITMOS.find(r => r.id === x.ritmo).lab;
  const p = 1 + diasDe(x)/plazo;
  return Math.min(8, x.medias ? p*2 : p);
}
function estado(x){
  const plazo = RITMOS.find(r => r.id === x.ritmo).lab, d = diasDe(x);
  if(d >= plazo*2) return { txt:"muy pasada", cls:"vencida" };
  if(d >= plazo) return { txt:"ya toca", cls:"vencida" };
  return { txt:`en ${plazo-d} día${plazo-d!==1?"s":""}`, cls:"" };
}

function cargar(){
  try{ const g = localStorage.getItem(CLAVE); if(g){ const p = JSON.parse(g); if(p && p.tareas) S = Object.assign(S, p); } }catch(e){}
}
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }

const pend = () => S.tareas.filter(x => !x.hecha);
const color = (i,n) => `hsl(${Math.round(200 + i*300/Math.max(n,1))} 58% ${i%2?58:46}%)`;

/* ---------- rueda ---------- */
function pintarRueda(){
  const g = document.getElementById("giro"), P = pend();
  g.innerHTML = "";
  if(!P.length) return;
  const total = P.reduce((a,x) => a + pesoReal(x), 0), R = 145;
  const pt = a => { const r = (a-90)*Math.PI/180; return [150+R*Math.cos(r), 150+R*Math.sin(r)]; };
  let acum = 0;
  P.forEach((x,i) => {
    const seg = 360*pesoReal(x)/total, a0 = acum, a1 = acum + seg;
    const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    if(P.length === 1) p.setAttribute("d", `M150,150 m-${R},0 a${R},${R} 0 1,0 ${R*2},0 a${R},${R} 0 1,0 -${R*2},0`);
    else p.setAttribute("d", `M150,150 L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${seg>180?1:0},1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`);
    p.setAttribute("fill", color(i, P.length));
    p.setAttribute("stroke","rgba(0,0,0,.18)"); p.setAttribute("stroke-width","1");
    g.appendChild(p);
    const c = a0 + seg/2 - 90, r = c*Math.PI/180;
    const tx = 150 + 132*Math.cos(r), ty = 150 + 132*Math.sin(r);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", tx.toFixed(2)); t.setAttribute("y", ty.toFixed(2));
    t.setAttribute("transform", `rotate(${c.toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})`);
    t.setAttribute("text-anchor","end"); t.setAttribute("dominant-baseline","middle");
    t.setAttribute("fill","#fff"); t.setAttribute("font-weight","700");
    t.setAttribute("font-size", seg < 14 ? 8 : seg < 24 ? 10 : 12);
    t.setAttribute("style","paint-order:stroke; stroke:rgba(0,0,0,.4); stroke-width:2.2px");
    t.textContent = (x.medias ? "› " : "") + (x.t.length > 16 ? x.t.slice(0,15) + "…" : x.t);
    g.appendChild(t);
    acum = a1;
  });
}

/* ---------- lista ---------- */
function filaTarea(x, P){
  const li = document.createElement("li"); if(x.hecha) li.className = "hecha";
  const f1 = document.createElement("div"); f1.className = "fila1";
  const d = document.createElement("span"); d.className = "punto";
  d.style.background = x.hecha ? "var(--line)" : color(P.indexOf(x), P.length);
  const nom = document.createElement("input"); nom.className = "nom"; nom.value = x.t;
  nom.onchange = () => { const v = nom.value.trim(); if(v) x.t = v; else nom.value = x.t; guardar(); pintarRueda(); };
  f1.append(d, nom);
  if(x.hecha){
    const v = document.createElement("button"); v.className = "mini"; v.textContent = "Volver";
    v.onclick = () => { x.hecha = false; x.ult = Date.now(); guardar(); pintar(); };
    f1.append(v);
  }else{
    const h = document.createElement("button"); h.className = "mini"; h.textContent = "Hecha";
    h.onclick = () => marcarHecha(x);
    f1.append(h);
  }
  const del = document.createElement("button"); del.className = "mini x"; del.textContent = "×";
  del.onclick = () => { S.tareas.splice(S.tareas.indexOf(x),1); guardar(); pintar(); };
  f1.append(del);
  li.append(f1);

  if(!x.hecha){
    const f2 = document.createElement("div"); f2.className = "fila2";
    const sel = document.createElement("select");
    RITMOS.forEach(r => { const o = document.createElement("option"); o.value = r.id; o.textContent = r.t; if(r.id === x.ritmo) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { x.ritmo = sel.value; guardar(); pintar(); };
    sel.style.cssText = "padding:6px 8px; font-size:.8rem; border-radius:9px";
    const e = estado(x);
    const et = document.createElement("span"); et.className = "etq " + e.cls; et.textContent = e.txt;
    const med = document.createElement("button"); med.className = "etq" + (x.medias ? " on" : "");
    med.textContent = x.medias ? "a medias · ×2" : "a medias";
    med.onclick = () => { x.medias = !x.medias; guardar(); pintar(); };
    f2.append(sel, et, med);
    li.append(f2);
  }
  return li;
}

function marcarHecha(x){
  x.medias = false;
  if(x.ritmo === "una") S.tareas.splice(S.tareas.indexOf(x),1);
  else { x.hecha = true; x.ult = Date.now(); x.fueraDias = 0; }
  guardar(); pintar();
}

function pintarListas(){
  const P = pend();
  const ul = document.getElementById("lista"); ul.innerHTML = "";
  P.slice().sort((a,b) => pesoReal(b) - pesoReal(a)).forEach(x => ul.appendChild(filaTarea(x, P)));
  const H = S.tareas.filter(x => x.hecha);
  const uh = document.getElementById("hechas"); uh.innerHTML = "";
  H.forEach(x => uh.appendChild(filaTarea(x, P)));
  document.getElementById("bloque-hechas").hidden = !H.length;
  const tocan = P.filter(x => diasDe(x) >= RITMOS.find(r => r.id === x.ritmo).lab).length;
  document.getElementById("cuenta").textContent =
    S.tareas.length ? `${P.length} en la rueda` + (tocan ? ` · ${tocan} ya toca${tocan>1?"n":""}` : "") : "Sin tareas";
  const b = document.getElementById("girar");
  b.disabled = !P.length || girando;
  b.textContent = !P.length ? (S.tareas.length ? "Todo hecho" : "Añade tareas con el +") : "Girar";
}

function pintar(){
  pintarRueda(); pintarListas();
  const vacio = pend().length === 0;
  document.getElementById("rueda").style.display = vacio ? "none" : "block";
  document.getElementById("aguja").style.display = vacio ? "none" : "block";
  let v = document.getElementById("vacio");
  if(vacio && !v){
    v = document.createElement("div"); v.id = "vacio"; v.className = "vacio";
    v.textContent = S.tareas.length ? "Nada en la rueda. Devuelve alguna de las hechas." : "Dale al + y mete tus tareas del curro.";
    document.getElementById("caja").appendChild(v);
  }else if(!vacio && v) v.remove();
  const fa = document.getElementById("fuera-aviso");
  fa.classList.toggle("on", !!S.fuera);
  if(S.fuera) document.getElementById("fuera-txt").textContent =
    `Fuera desde el ${new Date(S.fuera).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}. Nada crece.`;
}

/* ---------- girar ---------- */
function girar(){
  const P = pend();
  if(girando || !P.length) return;
  girando = true; document.getElementById("salida").innerHTML = ""; pintarListas();
  const total = P.reduce((a,x) => a + pesoReal(x), 0);
  let r = Math.random()*total, acum = 0, i = 0, a0 = 0, seg = 0;
  for(let k = 0; k < P.length; k++){
    if(r < acum + pesoReal(P[k])){ i = k; a0 = 360*acum/total; seg = 360*pesoReal(P[k])/total; break; }
    acum += pesoReal(P[k]);
  }
  const centro = a0 + seg/2 + (Math.random()-.5)*seg*.55;
  rot += (((360 - centro % 360) % 360 - (rot % 360)) + 360) % 360 + 360*5;
  document.getElementById("giro").style.transform = `rotate(${rot}deg)`;
  setTimeout(() => {
    girando = false;
    const t = P[i], e = estado(t);
    const c = document.createElement("div"); c.className = "tarjeta";
    c.innerHTML = `<div class="rot">Te toca</div><div class="que">${t.t}</div>
      <div class="det">${t.medias ? "La dejaste a medias · " : ""}${e.txt}</div>`;
    const b = document.createElement("div"); b.className = "btns";
    const ok = document.createElement("button"); ok.className = "b-ok"; ok.textContent = "Hecha";
    ok.onclick = () => { marcarHecha(t); document.getElementById("salida").innerHTML = ""; };
    const me = document.createElement("button"); me.className = "b-med"; me.textContent = "A medias";
    me.onclick = () => { t.medias = true; guardar(); pintar(); document.getElementById("salida").innerHTML = ""; };
    const otra = document.createElement("button"); otra.textContent = "Otra";
    otra.onclick = () => { document.getElementById("salida").innerHTML = ""; girar(); };
    b.append(ok, me, otra); c.append(b);
    document.getElementById("salida").appendChild(c);
    pintarListas();
  }, 4700);
}

/* ---------- alta ---------- */
function pintarRitmos(){
  const c = document.getElementById("ritmos"); c.innerHTML = "";
  RITMOS.forEach(r => {
    const b = document.createElement("button");
    b.textContent = r.t; b.className = r.id === ritmoElegido ? "on" : "";
    b.onclick = () => { ritmoElegido = r.id; pintarRitmos(); };
    c.appendChild(b);
  });
}
document.getElementById("mas").onclick = () => {
  const a = document.getElementById("alta");
  a.classList.toggle("abierta");
  if(a.classList.contains("abierta")){ pintarRitmos(); document.getElementById("nueva").focus(); }
};
document.getElementById("cancelar").onclick = () => {
  document.getElementById("alta").classList.remove("abierta");
  document.getElementById("nueva").value = "";
};
document.getElementById("add").onclick = () => {
  const i = document.getElementById("nueva"), v = i.value.trim();
  if(!v) return;
  S.tareas.push({ t:v, ritmo:ritmoElegido, ult:null, hecha:false, medias:false, fueraDias:0 });
  i.value = ""; guardar(); pintar();
  document.getElementById("alta").classList.remove("abierta");
};
document.getElementById("nueva").addEventListener("keydown", e => { if(e.key === "Enter") document.getElementById("add").click(); });
document.getElementById("girar").onclick = girar;

/* ---------- estoy fuera ---------- */
document.getElementById("irme").onclick = () => {
  if(S.fuera) return;
  S.fuera = Date.now(); guardar(); pintar();
};
document.getElementById("volver-fuera").onclick = () => {
  if(!S.fuera) return;
  const d = laborablesEntre(S.fuera, Date.now());
  S.tareas.forEach(x => { x.fueraDias = (x.fueraDias || 0) + d; });
  S.fuera = null; guardar(); pintar();
};

/* ---------- actualización ---------- */
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").then(r => r.update()).catch(() => {});
async function comprobarVersion(){
  try{
    const r = await fetch("./index.html?v=" + Date.now(), { cache:"no-store" });
    if(!r.ok) return;
    const m = (await r.text()).match(/class="ver">v([\d.]+)</);
    if(m && m[1] !== VERSION) document.getElementById("nueva-version").classList.add("on");
  }catch(e){}
}
document.getElementById("recargar").onclick = async () => {
  try{ if("serviceWorker" in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x => x.update())); } }catch(e){}
  location.reload();
};
document.addEventListener("visibilitychange", () => { if(!document.hidden){ comprobarVersion(); pintar(); } });
comprobarVersion();

cargar();
pintar();
</script>
</body>
</html>
